[workspace]
members = ["crates/supgang", "crates/supgang-acl", "crates/supgang-cli", "crates/supgang-quality"]
resolver = "3"

[workspace.package]
version = "0.2.0-alpha.10"
edition = "2024"
rust-version = "1.97.1"
authors = ["Agenxy contributors"]
license = "Apache-2.0"
repository = "https://github.com/Agenxy/supgang"
homepage = "https://agenxy.org/projects/supgang"

[workspace.dependencies]
async-trait = { version = "=0.1.92", default-features = false }
clap = { version = "=4.6.6", default-features = false, features = ["cargo", "derive", "help", "std", "usage"] }
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["alloc", "fast", "zeroize"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["async-await", "std"] }
getrandom = { version = "=0.4.3", default-features = false }
gethostname = { version = "=1.1.0", default-features = false }
hex = { version = "=0.4.3", default-features = false, features = ["alloc"] }
jiff = { version = "=0.2.35", default-features = false, features = ["std"] }
libc = { version = "=0.2.189", default-features = false }
minicbor = { version = "=2.3.0", default-features = false, features = ["alloc", "std"] }
nix = { version = "=0.31.3", default-features = false, features = ["net", "socket", "user"] }
portmapper = { version = "=0.19.1", default-features = false }
plist = { version = "=1.10.0", default-features = false, features = ["serde"] }
serde = { version = "=1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "=1.0.151", default-features = false, features = ["std"] }
sha2 = { version = "=0.11.0", default-features = false }
semver = { version = "=1.0.28", default-features = false, features = ["std"] }
thiserror = { version = "=2.0.20", default-features = false }
tough = { version = "=0.24.0", default-features = false }
url = { version = "=2.5.8", default-features = false }
zeroize = { version = "=1.9.0", default-features = false }
rustix = { version = "=1.1.4", default-features = false, features = ["fs", "process", "std"] }
quinn = { version = "=0.11.11", default-features = false, features = ["bloom", "runtime-tokio", "rustls-aws-lc-rs"] }
rcgen = { version = "=0.14.9", default-features = false, features = ["aws_lc_rs", "crypto", "zeroize"] }
rmcp = { version = "=3.1.3", default-features = false, features = ["server"] }
schemars = { version = "=1.2.2", default-features = false, features = ["derive", "std"] }
rustls = { version = "=0.23.45", default-features = false, features = ["aws_lc_rs", "prefer-post-quantum", "std"] }
tokio = { version = "=1.53.1", default-features = false, features = ["io-std", "io-util", "net", "process", "rt", "signal", "sync", "time"] }
tokio-util = { version = "=0.7.19", default-features = false, features = ["io"] }
toml = { version = "=1.1.4", default-features = false, features = ["display", "parse", "serde", "std"] }
supgang-acl = { path = "crates/supgang-acl" }

[workspace.lints.rust]
warnings = "deny"
unsafe_code = "forbid"
missing_docs = "deny"
unused_crate_dependencies = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
multiple_crate_versions = { level = "allow", priority = 1 }
cognitive_complexity = "deny"
dbg_macro = "deny"
expect_used = "deny"
indexing_slicing = "deny"
mem_forget = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
overflow-checks = true
panic = "abort"
strip = "symbols"

[profile.dev]
overflow-checks = true
panic = "unwind"
