[package]
name = "supgang-core"
description = "Protocol and durable-state engine for Supgang"
publish = ["crates-io"]
categories = ["command-line-utilities", "network-programming"]
keywords = ["discovery", "peer-to-peer", "sovereign", "networking"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"

[lib]
name = "supgang_core"
path = "src/lib.rs"

[dependencies]
async-trait.workspace = true
clap.workspace = true
ed25519-dalek.workspace = true
futures-util.workspace = true
getrandom.workspace = true
gethostname.workspace = true
hex.workspace = true
minicbor.workspace = true
nix.workspace = true
portmapper.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
semver.workspace = true
thiserror.workspace = true
tough.workspace = true
url.workspace = true
zeroize.workspace = true
rustix.workspace = true
quinn.workspace = true
rcgen.workspace = true
rmcp.workspace = true
schemars.workspace = true
supgang-acl.workspace = true
rustls.workspace = true
tokio.workspace = true
tokio-util.workspace = true
toml.workspace = true

[dev-dependencies]
jiff.workspace = true
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }
rmcp = { workspace = true, features = ["client"] }
tempfile = "=3.27.0"

[target.'cfg(target_os = "macos")'.dependencies]
plist.workspace = true

[lints]
workspace = true
