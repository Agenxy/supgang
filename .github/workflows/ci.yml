name: CI

defaults:
  run:
    shell: sh

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  quality:
    name: Quality (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner:
          - macos-15
          - ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Python script runner
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          python-version: "3.15.2"
          enable-cache: false
      - name: Install the pinned Python interpreter
        # setup-uv only selects this version; the gate runs uv offline, so the
        # interpreter must already be installed.
        run: uv python install 3.15.2
      - name: Run repository gate
        env:
          SUPGANG_QUALITY_CACHE: off
        run: cargo run --locked --package supgang-quality -- all
      - name: Build release binary
        run: cargo build --locked --workspace --release
      - name: Smoke-test command
        run: cargo run --locked --package supgang --release -- --version

  advisories:
    name: RustSec advisories
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit --version 0.22.2
      - name: Audit locked dependencies
        run: cargo audit --deny warnings --ignore RUSTSEC-2024-0436 --ignore RUSTSEC-2023-0089

  dependency-policy:
    name: Dependency licences and sources
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enforce dependency policy
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          rust-version: "1.99.1"
          command: check licenses sources
