name: CI

defaults:
  run:
    shell: sh

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  quality:
    name: Quality (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner:
          - macos-15
          - ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install the Python script runner
        uses: astral-sh/setup-uv@5a095e7a2014a4212f075830d4f7277575a9d098
        with:
          version: "0.11.16"
          python-version: "3.13.13"
          enable-cache: false
      - name: Run repository gate
        env:
          SUPGANG_QUALITY_CACHE: off
        run: cargo run --locked --package supgang-quality -- all
      - name: Build release binary
        run: cargo build --locked --workspace --release
      - name: Smoke-test command
        run: cargo run --locked --package supgang --release -- --version

  advisories:
    name: RustSec advisories
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit --version 0.22.2
      - name: Audit locked dependencies
        run: cargo audit --deny warnings --ignore RUSTSEC-2024-0436

  dependency-policy:
    name: Dependency licences and sources
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Enforce dependency policy
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          rust-version: "1.97.1"
          command: check licenses sources
