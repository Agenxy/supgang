name: CI

defaults:
  run:
    shell: sh

on:
  pull_request:
  push:
    branches:
      - main

# A newer push to the same pull request supersedes its older run. Runs on main
# are never cancelled, so every commit on main keeps a complete result.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  quality:
    name: Quality (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner:
          - macos-15
          - ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Python script runner
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.9"
          python-version: "3.15.2"
          enable-cache: false
      - name: Install the pinned Python interpreter
        # setup-uv only selects this version; the gate runs uv offline, so the
        # interpreter must already be installed.
        run: uv python install 3.15.2
      - name: Fetch and verify the published netwatch archive
        run: |
          archive="${CARGO_HOME:-$HOME/.cargo}/registry/cache/index.crates.io-1949cf8c6b5b557f/netwatch-0.20.2.crate"
          mkdir -p "$(dirname "$archive")"
          curl --fail --location --show-error --silent \
            https://static.crates.io/crates/netwatch/netwatch-0.20.2.crate \
            --output "$archive"
          printf '%s  %s\n' \
            2acf7a1ca9205d7c1fc9a1595193a8cbaa7537b4a07dca93c6ae3de7c8d0e597 \
            "$archive" | shasum -a 256 -c -
      - name: Fetch and verify the published portmapper archive
        run: |
          archive="${CARGO_HOME:-$HOME/.cargo}/registry/cache/index.crates.io-1949cf8c6b5b557f/portmapper-0.20.2.crate"
          mkdir -p "$(dirname "$archive")"
          curl --fail --location --show-error --silent \
            https://static.crates.io/crates/portmapper/portmapper-0.20.2.crate \
            --output "$archive"
          printf '%s  %s\n' \
            d36ce759df600731dd2511cd2d640bd551086b2f7b68bceb9bbcfd8c7ff86053 \
            "$archive" | shasum -a 256 -c -
      - name: Restore the Cargo build cache
        # Caches are scoped by GitHub: a pull request may read main's cache but
        # main never reads a pull request's, so a branch cannot seed main.
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.runner }}
      - name: Run repository gate
        env:
          SUPGANG_QUALITY_CACHE: off
        run: cargo run --locked --package supgang-quality -- all
      - name: Verify packaged multi-target dependency graph
        run: cargo run --locked --package supgang-quality -- packaged-deps
      - name: Build release binary
        run: cargo build --locked --workspace --release
      - name: Smoke-test command
        run: cargo run --locked --package supgang --release -- --version

  advisories:
    name: RustSec advisories
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit --version 0.22.2
      - name: Audit locked dependencies
        run: cargo audit --deny warnings --ignore RUSTSEC-2023-0089

  dependency-policy:
    name: Dependency licences and sources
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enforce dependency policy
        uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          rust-version: "1.100.0"
          command: check licenses sources
