name: Toolchain drift

# Fails, and so notifies the owner, when a pinned tool has a newer upstream release: the Rust
# toolchain, uv, Python, or any pinned action. Gates run on stale tools measure the past; clippy
# 1.99 found 33 issues on a tree that 1.97 called clean. Scheduled, not a pull-request gate: an
# upstream release is not a defect in any one change.
on:
  schedule:
    - cron: "17 14 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Python script runner
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: false
      - name: Compare every pin with upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo run --locked --package supgang-quality -- drift
